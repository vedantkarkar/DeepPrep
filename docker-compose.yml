services:
  postgres:
    image: postgres:16-alpine
    container_name: deepprep-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: deepprep
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deepprep"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: deepprep-backend
    restart: always
    environment:
      PROJECT_NAME: "DeepPrep"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgrespassword@postgres:5432/deepprep"
      SYNC_DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/deepprep"
      AI_PROVIDER: "mock"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deepprep-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
